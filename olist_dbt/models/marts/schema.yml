version: 2

models:
  - name: fct_orders
    description: >
      One row per order. The central fact table. Child tables (items, payments)
      are pre-aggregated to order grain before joining, so the row count equals
      stg_orders exactly. Reviews are already one-per-order after deduplication.
    columns:
      - name: order_id
        description: Primary key. This test is the fan-out guard.
        data_tests: [unique, not_null]

      - name: customer_id
        description: Per-order customer key. Join to dim_customers for the person.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_status
        data_tests: [not_null]

      - name: n_items
        description: Item lines on the order. Zero when no item rows exist.
        data_tests: [not_null]

      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

      - name: has_review
        data_tests: [not_null]

      - name: order_revenue
        description: >
          GMV for the order — sum of price + freight across item lines.
          No not_null test: NULL here means no item rows existed for the order,
          which is a real gap in the source, not a rule violation.

      - name: is_late
        description: >
          True when delivered after the estimate. NULL when undelivered.
          No not_null test: NULL means the question cannot be answered yet,
          which is by design, not a data problem.

  - name: dim_customers
    description: >
      One row per PERSON (customer_unique_id), not per order. 96,096 rows vs
      99,441 orders. City and state are the person's most recent known location,
      chosen by ROW_NUMBER over purchased_at desc with customer_id as tiebreak
      for reproducibility.
    columns:
      - name: customer_unique_id
        description: Primary key. The person.
        data_tests: [unique, not_null]

      - name: n_orders
        data_tests: [not_null]

      - name: is_repeat
        description: True when n_orders > 1. 2,997 people (3.1%).
        data_tests: [not_null]

      - name: state
        data_tests: [not_null]

  - name: dim_sellers
    description: >
      One row per seller (3,095). Carries location plus lifetime performance:
      volume, revenue, average review and late rate. seller_orders is
      de-duplicated to one row per (seller, order) so a multi-line order is
      not counted several times.
    columns:
      - name: seller_id
        description: Primary key.
        data_tests: [unique, not_null]

      - name: state
        data_tests: [not_null] 

      - name: n_orders
        description: Distinct orders the seller appeared on.
        data_tests: [not_null]

      - name: late_rate
        description: >
          n_late / n_late_known. NULL when the seller has no delivered orders
          with a known delivery date. Unweighted mean across sellers is 8.42%,
          higher than the 8.11% order-weighted rate — small sellers deliver worse.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1 

  - name: fct_seller_monthly
    description: >
      One row per seller per calendar month of order purchase. Sparse — a month
      with no sales produces no row, so downstream feature engineering must
      treat a missing month as zero sales, not as missing data. Numerator and
      denominator (n_late, n_late_known) are both carried because rates cannot
      be averaged across months; they must be recomputed from the counts.
      This is the table the seller risk scorecard trains on.

    columns:
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: order_month
        description: First day of the month the order was placed.
        data_tests: [not_null]

      - name: n_orders
        data_tests: [not_null]

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - seller_id
              - order_month   
                
  - name: fct_monthly
    description: >
      One row per calendar month across the whole dataset, including incomplete months at
      both ends. The analysis window is applied downstream, not here; n_reviews exposes the
      incompleteness. Nov 2016 has no row because it had no orders.
    columns:
      - name: order_month
        data_tests: [unique, not_null]
      - name: n_orders
        data_tests: [not_null]
      - name: n_customers
        data_tests: [not_null]

  - name: fct_cohort_retention
    description: >
      One row per (cohort_month, month_number), for cohorts formed inside the analysis
      window. Triangular by construction: a row exists only where the month has elapsed by
      2018-08-31, so an unobserved month is absent rather than zero. 210 rows = 20+19+...+1.
    columns:
      - name: cohort_month
        data_tests: [not_null]
      - name: month_number
        data_tests: [not_null]
      - name: retention
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cohort_month
              - month_number

  - name: fct_seller_snapshots
    description: >
      Modelling panel for the seller risk scorecard. One row per (seller_id,
      snapshot_month) for 12 monthly snapshots, Jun 2017 to May 2018. Features
      (obs_*) are aggregated over the 6 months ending AT the snapshot, inclusive.
      The outcome (perf_*) is aggregated over the 3 months AFTER the snapshot.
      The two windows are disjoint by construction and the snapshot month belongs
      to the observation side. Eligibility: at least 10 delivered orders with a
      known lateness outcome in the observation window, and at least 5 in the
      performance window. 4,522 rows, 767 distinct sellers, 27.7% bad.
    columns:
      - name: snapshot_month
        data_tests: [not_null]
      - name: seller_id
        data_tests: [not_null]
      - name: is_bad
        description: perf_late_rate above 0.10.
        data_tests: [not_null]
      - name: obs_known
        description: Observation-window denominator. Eligibility floor is 10.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 10
                inclusive: true
      - name: perf_known
        description: Performance-window denominator. Eligibility floor is 5.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 5
                inclusive: true
      - name: obs_late_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: true}
      - name: perf_late_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: true}
      - name: obs_avg_review
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 5, inclusive: true}
      - name: obs_active_months
        description: Months traded within the 6-month observation window.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 6, inclusive: true}
      - name: tenure_months
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: true}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - seller_id
              - snapshot_month

  - name: fct_delivery_by_state
    description: >
      One row per customer state, over orders where lateness is known (96,476).
      Feeds the delivery map. Same denominator as the headline late rate, so the
      dashboard and docs/findings.md cannot disagree. share_of_orders lets a
      reader weight any state's gap by its size before acting on it.
    columns:
      - name: state
        data_tests: [unique, not_null]
      - name: n_orders
        data_tests: [not_null]
      - name: late_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: true}
      - name: review_ontime
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 5, inclusive: true}
      - name: review_late
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 5, inclusive: true}

  - name: fct_delivery_by_category
    description: >
      One row per product category with at least 100 orders. An order is counted
      in every category it contains; 97.9% contain exactly one, 0.74% span two or
      more, so the order total slightly exceeds the marketplace total.
    columns:
      - name: category
        data_tests: [unique, not_null]
      - name: n_orders
        data_tests: [not_null]
      - name: late_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: true}

  - name: fct_delay_bands
    description: >
      The dose-response table. Bands are 1-3 / 4-7 / 8-14 / 15+ days late and match
      docs/findings.md exactly. band_order exists so a BI tool sorts by severity
      rather than alphabetically.
    columns:
      - name: band_order
        data_tests: [unique, not_null]
      - name: delay_band
        data_tests: [unique, not_null]
      - name: avg_review
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 5, inclusive: true}
